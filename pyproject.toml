[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosync"
version = "0.1.0b0"
description = "Multi-track audio timebase estimation, alignment and clock-drift correction for recordings from independent devices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "ChronoSync contributors" }]
keywords = ["audio", "alignment", "sync", "clock-drift", "gcc-phat", "multi-track"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
io = ["soundfile>=0.12", "soxr>=0.3"]
dev = ["pytest>=8", "psutil>=5.9"]

[project.scripts]
chronosync = "chronosync.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
